[package]
name = "mail-ui-settings"
# Settings: the window of pages, and the parts only it draws (rules, vacation reply, contacts,
# keyboard, the default mail program), below the window.
publish = false
version = "0.1.0"
autobins = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mailo's Settings window, drawn with quire, below the window"
repository = "https://github.com/PoHsuanLai/mailo"
authors = ["Po Hsuan Lai <pohsuanlai0208@gmail.com>"]

[features]
# Test-only exports the window's own tests reach: off in the program.
testing = []

[dependencies]
porter-core.workspace = true
porter-provider.workspace = true
# `CalendarRef`, which the Calendar page picks the calendar by.
porter-calendar.workspace = true
mail-domain.workspace = true
mail-logic.workspace = true
# Everything the window knows of mail: values read, commands made, servers asked, all through the
# one client. No `mail-core`, `mail-store` or `mail-runtime`: a store is not something the window
# can name. `desktop` names the desktop's notification service, which the window speaks to itself.
mail-client = { workspace = true, features = ["desktop"] }
# What the window knows and says without drawing: the settings files, its words, what is picked.
mail-ui-model.workspace = true
# The window below its parts: its shell state, hooks, motion and shared controls.
mail-ui-kit.workspace = true
mail-os.workspace = true
mail-proto.workspace = true
mail-pim.workspace = true
mail-mime.workspace = true
mail-reader.workspace = true
mail-editor.workspace = true
serde.workspace = true
serde_json = "1"
# What the window logs; the program installs the one logger it goes through.
log.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
chrono.workspace = true
uuid = { workspace = true }
# The renderer is quire's `ds-blitz` (Blitz, drawn with wgpu); dioxus itself brings none.
dioxus = { version = "0.7" }
# chordkit, the keymap core quire resolves keys with. The rev quire pins, so one chordkit is built.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }
# quire, the shared design system, pinned as the desktop manifest pins it.
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "39f34fc1a5aec73240010b3c7643844f6e05713b" }  # 39f34fc1 (v0.3.58 + scroll-together; forks blitz 841386a7, blitz-kit 5b5380d0)
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "39f34fc1a5aec73240010b3c7643844f6e05713b", features = ["dioxus"] }  # 39f34fc1 (v0.3.58 + scroll-together; forks blitz 841386a7, blitz-kit 5b5380d0)
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "39f34fc1a5aec73240010b3c7643844f6e05713b", features = ["pdf", "print", "spell"] }  # 39f34fc1 (v0.3.58 + scroll-together; forks blitz 841386a7, blitz-kit 5b5380d0)
base64 = "0.22"
toml = "1"

[dev-dependencies]
# The values a test starts from (`mail_domain::testing`): the program never has them.
mail-domain = { workspace = true, features = ["testing"] }
mail-client = { workspace = true, features = ["testing"] }
mail-ui-kit = { workspace = true, features = ["testing"] }
dioxus-ssr = "0.7"
tempfile = "3"

[lints]
workspace = true
